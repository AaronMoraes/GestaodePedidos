<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área Administrativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-login {
            width: 100%;
        }

        #mensagem {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h2 class="login-title">Área Administrativa</h2>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="usuario" class="form-label">
                        Usuário
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="usuario"
                        required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-login">
                    Entrar
                </button>

            </form>

            <div
                id="mensagem"
                class="alert mt-3">
            </div>

        </div>

    </div>

    <script>
        /*const API_URL = 'http://localhost:5000/api';*/
        const API_URL = 'https://effective-spork-q7qwqqwvrg4vf99qx-5000.app.github.dev/api';

        const loginForm = document.getElementById('loginForm');
        const mensagem = document.getElementById('mensagem');

        loginForm.addEventListener('submit', async function (event) {

            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;

            try {

                const resposta = await fetch(`${API_URL}/Admin/login`, {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        usuario: usuario,
                        senha: senha
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        dados.message || 'Usuário ou senha inválidos.'
                    );
                }

                localStorage.setItem('adminToken', dados.token);

                window.location.href = 'PainelAdmin.html';


            } catch (erro) {

                mensagem.className = 'alert alert-danger mt-3';
                mensagem.textContent = erro.message;
                mensagem.style.display = 'block';
            }
        });
    </script>

</body>

</html>
