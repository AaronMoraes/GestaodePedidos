<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
        }

        .admin-header {
            background: #212529;
            color: white;
            padding: 20px;
        }

        .admin-container {
            padding: 40px 20px;
        }

        .admin-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            height: 100%;
        }
    </style>
</head>

<body>

    <header class="admin-header">
        <div class="container">
            <h1>Painel Administrativo</h1>
            <p class="mb-0">Gerenciamento do sistema de pedidos</p>
        </div>
    </header>

    <main class="container admin-container">

        <div class="row g-4">

            <div class="col-md-4">
                <div class="admin-card">
                    <h3>🍔 Lanches</h3>
                    <p>Gerenciar os lanches do cardápio.</p>

                    <button class="btn btn-success mb-2" onclick="adicionarProduto()">
                        + Adicionar Lanche
                    </button>

                    <button class="btn btn-primary" onclick="carregarLanches()">
                        Gerenciar Lanches
                    </button>

                    <div id="listaLanches" class="mt-4"></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="admin-card">
                    <h3>🥤 Bebidas</h3>
                    <p>Gerenciar as bebidas do cardápio.</p>

                    <button class="btn btn-primary" onclick="carregarBebidas()">
                        Gerenciar Bebidas
                    </button>

                    <div id="listaBebidas" class="mt-4"></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="admin-card">
                    <h3>🍟 Combos</h3>
                    <p>Gerenciar os combos do cardápio.</p>

                    <button class="btn btn-primary" onclick="carregarCombos()">
                        Gerenciar Combos
                    </button>

                    <div id="listaCombos" class="mt-4"></div>
                </div>
            </div>

        </div>

    </main>
    <script>
        const API_URL = 'https://effective-spork-q7qwqqwvrg4vf99qx-5000.app.github.dev/api';
        /*const API_URL = 'http://localhost:5000/api'; */

        async function carregarLanches() {

            const token = localStorage.getItem('adminToken');

            const resposta = await fetch(`${API_URL}/Produtos`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!resposta.ok) {
                alert('Não foi possível carregar os lanches.');
                return;
            }

            const produtos = await resposta.json();

            const lista = document.getElementById('listaLanches');

            lista.innerHTML = '';

            produtos
                .filter(produto => produto.id >= 1 && produto.id <= 8)
                .forEach(produto => {

                    const item = document.createElement('div');

                    item.className = 'border rounded p-3 mb-2';

                    item.innerHTML = `
    <strong>${produto.nome}</strong>
    <br>
    R$ ${produto.preco.toFixed(2).replace('.', ',')}
    <br><br>

    <button
        class="btn btn-warning btn-sm"
        onclick="editarProduto(${produto.id}, '${produto.nome}', ${produto.preco})">
        Editar
    </button>

    <button
    class="btn btn-danger btn-sm"
    onclick="excluirProduto(${produto.id})">
    Excluir
</button>
`;

                    lista.appendChild(item);
                });
        }
        async function editarProduto(id, nome, preco) {

            const novoNome = prompt('Nome do produto:', nome);

            if (novoNome === null) {
                return;
            }

            const novoPreco = prompt('Preço do produto:', preco);

            if (novoPreco === null) {
                return;
            }

            const precoNumerico = Number(novoPreco.replace(',', '.'));

            if (isNaN(precoNumerico) || precoNumerico < 0) {
                alert('Digite um preço válido.');
                return;
            }

            const token = localStorage.getItem('adminToken');

            const resposta = await fetch(`${API_URL}/Produtos/${id}`, {
                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify({
                    nome: novoNome,
                    preco: precoNumerico
                })
            });

            if (!resposta.ok) {
                const erro = await resposta.json();

                alert(erro.message || 'Não foi possível atualizar o produto.');
                return;
            }

            alert('Produto atualizado com sucesso.');

            carregarLanches();
        }

        async function excluirProduto(id) {

            const confirmar = confirm(
                'Tem certeza que deseja excluir este produto?'
            );

            if (!confirmar) {
                return;
            }

            const token = localStorage.getItem('adminToken');

            const resposta = await fetch(`${API_URL}/Produtos/${id}`, {
                method: 'DELETE',

                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!resposta.ok) {
                const erro = await resposta.json();

                alert(erro.message || 'Não foi possível excluir o produto.');
                return;
            }

            alert('Produto excluído com sucesso.');

            carregarLanches();
        }

        async function adicionarProduto() {

            const nome = prompt('Nome do novo lanche:');

            if (nome === null) {
                return;
            }

            if (nome.trim() === '') {
                alert('O nome do lanche é obrigatório.');
                return;
            }

            const preco = prompt('Preço do novo lanche:');

            if (preco === null) {
                return;
            }

            const precoNumerico = Number(preco.replace(',', '.'));

            if (isNaN(precoNumerico) || precoNumerico < 0) {
                alert('Digite um preço válido.');
                return;
            }

            const token = localStorage.getItem('adminToken');

            const resposta = await fetch(`${API_URL}/Produtos`, {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },

                body: JSON.stringify({
                    nome: nome.trim(),
                    preco: precoNumerico
                })
            });

            if (!resposta.ok) {
                const erro = await resposta.json();

                alert(erro.message || 'Não foi possível adicionar o lanche.');
                return;
            }

            alert('Lanche adicionado com sucesso.');

            carregarLanches();
        }

        async function carregarBebidas() {

            const token = localStorage.getItem('adminToken');

            const resposta = await fetch(`${API_URL}/Produtos`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!resposta.ok) {
                alert('Não foi possível carregar as bebidas.');
                return;
            }

            const produtos = await resposta.json();

            const lista = document.getElementById('listaBebidas');

            lista.innerHTML = '';

            produtos
                .filter(produto => produto.id >= 13 && produto.id <= 25)
                .forEach(produto => {

                    const item = document.createElement('div');

                    item.className = 'border rounded p-3 mb-2';

                    item.innerHTML = `
                <strong>${produto.nome}</strong>
                <br>
                R$ ${produto.preco.toFixed(2).replace('.', ',')}
            `;

                    lista.appendChild(item);
                });
        }


        async function carregarCombos() {

            const token = localStorage.getItem('adminToken');

            const resposta = await fetch(`${API_URL}/Produtos`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!resposta.ok) {
                alert('Não foi possível carregar os combos.');
                return;
            }

            const produtos = await resposta.json();

            const lista = document.getElementById('listaCombos');

            lista.innerHTML = '';

            produtos
                .filter(produto => produto.id >= 30 && produto.id <= 37)
                .forEach(produto => {

                    const item = document.createElement('div');

                    item.className = 'border rounded p-3 mb-2';

                    item.innerHTML = `
                <strong>${produto.nome}</strong>
                <br>
                R$ ${produto.preco.toFixed(2).replace('.', ',')}
            `;

                    lista.appendChild(item);
                });
        }
    </script>
</body>

</html>
